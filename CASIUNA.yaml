# CASIUNA Edition - Customized for Mihomo / Clash Party

# Anchors
x-base-provider: &base-provider 
  type: http
  interval: 86400
  proxy: DIRECT
  health-check: {enable: true, url: 'https://www.google.com/generate_204', interval: 300}
  exclude-filter: '群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|过滤|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author'

x-url-test:     &url-test     { type: url-test, url: "https://www.gstatic.com/generate_204", interval: 300, empty-fallback: REJECT, include-all: true, hidden: true, tolerance: 50 }
x-fallback:     &fallback     { type: fallback, url: "https://www.gstatic.com/generate_204", interval: 300, empty-fallback: REJECT }

# Region Filters
x-filter-ms:    &filter-ms    '(?i)(yylx|bajie)'

x-filter-ai:    &filter-ai    "(?i)((yylx|bajie).*(🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|USA))|((🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|USA).*(IEPL|GPT))"
x-filter-game:  &filter-game  '(?i)(IEPL|游戏|🎮|\bGAME\b)'

x-filter-hk:    &filter-hk    "(?i)🇭🇰|香港|港深|深港|沪港|广港|陆港|HK|HongKong"
x-filter-tw:    &filter-tw    "(?i)🇹🇼|🇼🇸|台湾|台北|台中|台南|台东|湾湾|TW|Taipei|Taiwan"
x-filter-us:    &filter-us    "(?i)🇺🇸|美国|美东|美西|美中|美南|美港|美日|中美|美专|US|USA|America|United States"
x-filter-sg:    &filter-sg    "(?i)🇸🇬|新加坡|坡县|坡|狮城|SG|Singapore"
x-filter-jp:    &filter-jp    "(?i)🇯🇵|日本|东京|大阪|京都|神奈川|琦玉|JP|Japan|Tokyo"
x-filter-kr:    &filter-kr    "(?i)🇰🇷|韩国|首尔|KR|Korea|Seoul"


# Proxy Anchors
x-media:        &media        [Manual Switch, SG, US, HK]
x-appleTV:      &appleTV      [Manual Switch, SG-AUTO, US-AUTO, HK-AUTO, DIRECT]
x-tg:           &tg           [Manual Switch, TW-AUTO, HK-AUTO]
x-cr:           &cr           [Manual Switch, Residential]
x-yt:           &yt           [Manual Switch, HK-AUTO, SG-AUTO]

x-auto-all:     &auto-all     [HK-AUTO, TW-AUTO, US-AUTO, SG-AUTO, JP-AUTO, KR-AUTO]
x-auto-hk:      &auto-hk      [Manual Switch, HK-AUTO]
x-auto-tw:      &auto-tw      [Manual Switch, TW-AUTO]
x-auto-us:      &auto-us      [Manual Switch, US-AUTO]
x-auto-sg:      &auto-sg      [Manual Switch, SG-AUTO]
x-auto-jp:      &auto-jp      [Manual Switch, JP-AUTO]
x-auto-kr:      &auto-kr      [Manual Switch, KR-AUTO]
x-direct:       &direct       [DIRECT, Manual Switch]
x-oversea:      &oversea      [Fallback, Manual Switch, DIRECT]
x-match:        &match        [Fallback, Manual Switch]

x-rule-set-domain: &rule-set-domain { type: http, behavior: domain, format: mrs, interval: 86400 }
x-rule-set-ipcidr: &rule-set-ipcidr { type: http, behavior: ipcidr, format: mrs, interval: 86400 }

# Proxy Providers
proxy-providers:
  yylx: {<<: *base-provider, url: 'http://127.0.0.1:38324/download/yylx?target=ClashMeta'}
  bajie: {<<: *base-provider, url: 'http://127.0.0.1:38324/download/bajie?target=ClashMeta'}
  residential:
    type: http
    interval: 3600
    proxy: DIRECT
    url: 'http://127.0.0.1:38324/download/Residential?target=ClashMeta'
    health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}

