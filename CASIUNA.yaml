# General
mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
log-level: info
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600
authentication: [mihomo:casiuna]
skip-auth-prefixes: [127.0.0.1/8, '::1/128']
experimental: {quic-go-disable-gso: true}

# Dashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: casiuna
profile: {store-selected: true, store-fake-ip: true}

# Sniffer
sniffer:
  enable: true
  sniff:
    HTTP:  {ports: [80, 8080-8880], override-destination: true}
    TLS:   {ports: [443, 8443]}
    QUIC:  {ports: [443, 8443]}
  skip-domain: ["Mijia Cloud", "+.push.apple.com"]

# TUN
tun:
  enable: false
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 172.16.15.1
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
    - 8.8.8.8
  nameserver-policy:
    "casiuna.com": [172.16.15.1]
    "rule-set:China": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query, 223.5.5.5]
    "geosite:cn": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query, 223.5.5.5]
    "raw.githubusercontent.com,github.com,+.github.io": [8.8.8.8, 1.1.1.1]
  fake-ip-filter:
    - "+.lan"
    - "*.local"
    - "+.miwifi.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "+.casiuna.com"

# Proxy Groups
proxy-groups:
  # Manual
  - { name: Manual Switch, type: select, proxies: [DIRECT], include-all: true, filter: *filter-ms, icon: https://raw.githubusercontent.com/lige47/lige_icon/main/icon/02ProxySoftLogo/Loon(1).png }
